syntax = "proto3";

option go_package = "/protobuf";

package protobuf;

message Message {
  string type = 1;
  bytes id = 2;
  uint32 sender = 3;
  bytes data = 4;
}


// Areopagus intra-shard consensus messages.
// Prefix protobuf message names by consensus protocol to avoid ambiguity.

// RBC messages
message RBC_Propose{
  repeated string txs = 1;
}
message RBC_Echo{
  repeated string txs = 1;
}
message RBC_Ready{
  bytes h = 1;
  bytes sig = 2;
}

// Cross-shard: worker-shard nodes notify shard-0 about (2f+1) delivered RBC instances in an epoch.
// Bitmap length = ceil(N/8). Bit i corresponds to proposer SID i within that worker shard.
message RBC_Bitmap{
  uint32 shard = 1;
  uint32 epoch = 2;
  bytes bitmap = 3;
  reserved 4;
  reserved "rbc_sid";
  // Hashes for the 2f+1 RBC instances indicated by this bitmap.
  // Length = 2f+1, ordered by increasing RBC SID among the set bits.
  repeated bytes rbc_hash = 5;
}

// Cross-shard: shard-0 nodes send MVBA decided value back to the worker shard.
message MVBA_Result{
  uint32 shard = 1;
  uint32 epoch = 2;
  bytes result = 3;
}

// Cross-shard: producer worker shard distributes a batch of cross-shard txs
// to nodes in another input shard so that shard can include them in its RBC
// for the same epoch.
message CTX_Distribute{
  uint32 epoch = 1;
  uint32 target_shard = 2;
  uint32 source_shard = 3;
  repeated string txs = 4;
}

// Provable Broadcast (PB) messages
message Value {
  bytes value = 1;
  bytes validation = 2;
}

message Echo {
  bytes sigshare = 1;
}

// MVBA messages
message Lock {
  bytes value = 1;
  bytes sig = 2;
}

message Finish {
  bytes value = 1;
  bytes sig = 2;
}

message Done {
  bytes coinShare = 1;
}

message Halt {
  bytes value = 1;
  bytes sig = 2;
}

message PreVote {
  bool vote = 1;
  bytes value = 2;
  bytes sig = 3;
}

message Vote {
  bool vote = 1;
  bytes value = 2;
  bytes sig = 3;
  bytes sigshare = 4;
}

// (Optional) MVBA default validation payloads (kept for compatibility).
message BLockSetValue {
  repeated uint32 pid = 1;
  repeated bytes hash = 2;
}

message BLockSetValidation {
  repeated bytes sig = 1;
}
