syntax = "proto3";

option go_package = "/protobuf";

message Message {
  string type = 1;
  bytes id = 2;
  uint32 sender = 3;
  bytes data = 4;
}


// Chamael intra-shard consensus messages.
// 为防止混淆，不同共识协议的 protobuf 消息名统一加前缀：HS / RBC。

// HotStuff (2-phase) messages
message HS_New_View{
  bytes none = 1;
}
message HS_Prepare{
  repeated string txs = 1;
}
message HS_Prepare_Vote{
  uint32 vote = 1;
  bytes sig = 2;
}
message HS_Precommit{
  bytes aggsig = 1;
  bytes aggpk = 2;
}
message HS_Precommit_Vote{
  uint32 vote = 1;
  bytes sig = 2;
}
message HS_Commit{
  bytes aggsig = 1;
  bytes aggpk = 2;
}

// RBC messages
message RBC_Propose{
  repeated string txs = 1;
}
message RBC_Echo{
  repeated string txs = 1;
}
message RBC_Ready{
  bytes h = 1;
  bytes sig = 2;
}
